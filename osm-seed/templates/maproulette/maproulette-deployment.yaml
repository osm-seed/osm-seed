{{- if .Values.maproulette.enabled -}}
{{- $mr := .Values.maproulette -}}
{{- $db := .Values.maprouletteDb -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-maproulette
  labels:
    app: {{ template "osm-seed.name" . }}
    component: maproulette
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  # The backend runs an Akka cluster and caches in memory, keep one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-maproulette
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-maproulette
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/maproulette/maproulette-configmap.yaml") . | sha256sum }}
    spec:
      priorityClassName: {{ .Release.Name }}-{{ $mr.priorityClass | default "medium-priority" }}
      containers:
        - name: maproulette-api
          image: "{{ $mr.api.image.name }}:{{ $mr.api.image.tag }}"
          ports:
            - name: api
              containerPort: 9000
          env:
            - name: MR_DATABASE_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-maproulette-db:5432/{{ $db.env.POSTGRES_DB }}"
            - name: MR_DATABASE_USERNAME
              value: {{ $db.env.POSTGRES_USER | quote }}
            - name: MR_DATABASE_PASSWORD
              value: {{ $db.env.POSTGRES_PASSWORD | quote }}
            - name: MR_OSM_SERVER
              value: {{ $mr.osmServerUrl | quote }}
            - name: MR_FRONTEND_URL
              value: {{ $mr.publicUrl | quote }}
            - name: MR_PUBLIC_ORIGIN
              value: {{ $mr.publicUrl | quote }}
            {{- range $key, $value := $mr.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /MapRouletteAPI/conf/application-overrides.conf
              subPath: application-overrides.conf
          # JVM start and DB migrations take time on the first run.
          startupProbe:
            httpGet:
              path: /ping
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ping
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: api
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- include "osm-seed.resources" $mr.api | nindent 10 }}
        - name: maproulette-web
          image: "{{ $mr.web.image.name }}:{{ $mr.web.image.tag }}"
          ports:
            - name: http
              containerPort: 80
          env:
            - name: MR_URL
              value: {{ $mr.publicUrl | quote }}
            - name: MR_OSM_SERVER
              value: {{ $mr.osmServerUrl | quote }}
            - name: MR_OSM_API_SERVER
              value: {{ $mr.osmApiServerUrl | default $mr.osmServerUrl | quote }}
            - name: MR_API_URL
              value: http://localhost:9000
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          {{- include "osm-seed.resources" $mr.web | nindent 10 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-maproulette-config
      {{- include "osm-seed.nodeSelector" $mr | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" $mr | nindent 6 }}
{{- end }}
