{{- if .Values.maproulette.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-maproulette
  labels:
    app: {{ template "osm-seed.name" . }}
    component: maproulette
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
  {{- with .Values.maproulette.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.serviceType }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
  selector:
    app: {{ template "osm-seed.name" . }}
    release: {{ .Release.Name }}
    run: {{ .Release.Name }}-maproulette
{{- end }}
