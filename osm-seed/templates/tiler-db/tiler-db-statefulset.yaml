{{- if .Values.tilerDb.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-tiler-db
  labels:
    app: {{ .Release.Name }}-tiler-db
    component: tiler-db
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-tiler-db
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-tiler-db
  serviceName: {{ .Release.Name }}-tiler-db
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-tiler-db
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-tiler-db
    spec:
      priorityClassName: {{ .Release.Name }}-{{ .Values.tilerDb.priorityClass | default "medium-priority" }}
      {{- with include "osm-seed.volume.owner" (dict "root" . "values" .Values.tilerDb "component" "tiler-db" "volume" "postgres-storage") }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-tiler-db
          image: "{{ .Values.tilerDb.image.name }}:{{ .Values.tilerDb.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-tiler-db-env
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
           {{- if and .Values.tilerDb.postgresqlConfig.enabled .Values.tilerDb.persistenceDisk.enabled }}
          args:
            - "-c"
            - "config_file=/etc/postgresql/postgresql.conf"
           {{- end }}
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - exec pg_isready --host $POD_IP -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 120
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - exec pg_isready --host $POD_IP -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: postgres-storage
              mountPath: {{ .Values.tilerDb.persistenceDisk.mountPath }}
              subPath: {{ .Values.tilerDb.persistenceDisk.subPath }}
            {{- if and .Values.tilerDb.postgresqlConfig.enabled .Values.tilerDb.persistenceDisk.enabled }}
            - name: tiler-db-postgresql-config
              mountPath: /etc/postgresql/
            {{- end }}
            - name: shared-memory
              mountPath: /dev/shm
          {{- include "osm-seed.resources" .Values.tilerDb | nindent 10 }}
      volumes:
        - name: postgres-storage
        {{- if .Values.tilerDb.persistenceDisk.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-tiler-db-data
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- if and .Values.tilerDb.postgresqlConfig.enabled .Values.tilerDb.persistenceDisk.enabled }}
        - name: tiler-db-postgresql-config
          configMap:
            name: {{ .Release.Name }}-tiler-db-postgresql-config
        {{- end }}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tilerDb.sharedMemorySize | default "64Mi" }}
      {{- include "osm-seed.nodeSelector" .Values.tilerDb | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" .Values.tilerDb | nindent 6 }}
{{- end }}
