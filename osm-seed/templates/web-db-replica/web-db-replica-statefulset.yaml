{{- if .Values.webDbReplica.enabled -}}
{{- if not (and .Values.webDb.enabled .Values.webDb.postgresqlConfig.enabled) }}
{{- fail "webDbReplica requires webDb.enabled and webDb.postgresqlConfig.enabled" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-web-db-replica
  labels:
    app: {{ template "osm-seed.name" . }}
    component: web-db-replica
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-web-db-replica
  serviceName: {{ .Release.Name }}-web-db-replica
  template:
    {{- $pgdata := printf "%s/pgdata" .Values.webDbReplica.persistenceDisk.mountPath }}
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-web-db-replica
    spec:
      priorityClassName: {{ .Release.Name }}-{{ .Values.webDbReplica.priorityClass | default "high-priority" }}
      {{- include "osm-seed.serviceAccount" .Values.webDb | nindent 6 }}
      initContainers:
        # First start only (empty PGDATA): copy web-db with pg_basebackup and set it up as a standby.
        # To rebuild the replica, delete its volume.
        - name: {{ .Chart.Name }}-web-db-replica-init
          image: "{{ .Values.webDb.image.name }}:{{ .Values.webDb.image.tag }}"
          command:
            - "sh"
            - "-c"
            - |
              set -e
              if [ -s "$PGDATA/PG_VERSION" ]; then
                echo "PGDATA already initialized, starting as standby"
                exit 0
              fi
              mkdir -p "$PGDATA" && chown postgres:postgres "$PGDATA" && chmod 700 "$PGDATA"
              until pg_isready -q -h "$PRIMARY_HOST"; do echo "Waiting for $PRIMARY_HOST"; sleep 10; done
              su postgres -c "pg_basebackup -h $PRIMARY_HOST -U $POSTGRES_USER -D $PGDATA -X stream -R -P"
              cat >> "$PGDATA/postgresql.auto.conf" <<EOF
              primary_conninfo = 'host=$PRIMARY_HOST port=5432 user=$POSTGRES_USER password=$PGPASSWORD application_name=web-db-replica'
              {{- if .Values.webDb.pgbackrest.enabled }}
              restore_command = 'pgbackrest --stanza=main --pg1-path={{ $pgdata }} archive-get %f "%p"'
              {{- end }}
              EOF
          env:
            - name: PRIMARY_HOST
              value: {{ .Release.Name }}-web-db
            - name: POSTGRES_USER
              value: {{ default "postgres" .Values.webDb.env.POSTGRES_USER | quote }}
            - name: PGPASSWORD
              value: {{ quote .Values.webDb.env.POSTGRES_PASSWORD }}
            - name: PGDATA
              value: {{ $pgdata }}
          volumeMounts:
            - name: postgres-storage
              mountPath: {{ .Values.webDbReplica.persistenceDisk.mountPath }}
      containers:
        - name: {{ .Chart.Name }}-web-db-replica
          image: "{{ .Values.webDb.image.name }}:{{ .Values.webDb.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGUSER
              value: {{ default "postgres" .Values.webDb.env.POSTGRES_USER | quote }}
            - name: PGDATA
              value: {{ $pgdata }}
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          command:
            - "sh"
            - "-c"
            - "su postgres -c 'postgres -c config_file=/etc/postgresql/postgresql.conf'"
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - exec pg_isready --host $POD_IP
            initialDelaySeconds: 120
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - exec pg_isready --host $POD_IP
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: postgres-storage
              mountPath: {{ .Values.webDbReplica.persistenceDisk.mountPath }}
            - name: shared-memory
              mountPath: /dev/shm
            - name: db-postgresql-config
              mountPath: /etc/postgresql/
            {{- if .Values.webDb.pgbackrest.enabled }}
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest
            {{- end }}
          {{- include "osm-seed.resources" .Values.webDbReplica | nindent 10 }}
      volumes:
        - name: postgres-storage
        {{- if .Values.webDbReplica.persistenceDisk.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-web-db-replica-data
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.webDbReplica.sharedMemorySize }}
        - name: db-postgresql-config
          configMap:
            name: {{ .Release.Name }}-web-db-postgresql-config
        {{- if .Values.webDb.pgbackrest.enabled }}
        - name: pgbackrest-config
          secret:
            secretName: {{ .Release.Name }}-web-db-pgbackrest
        {{- end }}
      {{- include "osm-seed.nodeSelector" .Values.webDbReplica | nindent 6 }}
      {{- include "osm-seed.affinity" (dict "root" . "values" .Values.webDbReplica "component" "web-db") | nindent 6 }}
{{- end }}
