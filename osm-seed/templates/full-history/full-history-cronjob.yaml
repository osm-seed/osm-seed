{{- if .Values.fullHistory.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-full-history
  labels:
    app: {{ template "osm-seed.name" . }}
    component: full-history
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  schedule: {{ quote .Values.fullHistory.schedule }}
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          {{- include "osm-seed.serviceAccount" .Values.fullHistory | nindent 10 }}
          containers:
          - name: {{ .Release.Name }}-full-history
            image: "{{ .Values.fullHistory.image.name }}:{{ .Values.fullHistory.image.tag }}"
            command: ['/start.sh']
            {{- include "osm-seed.resources" .Values.fullHistory | nindent 12 }}
            env:
              - name: POSTGRES_HOST
                value: {{ .Release.Name }}-web-db
              - name: POSTGRES_DB
                value: {{ .Values.webDb.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote .Values.webDb.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ .Values.webDb.env.POSTGRES_USER }}
              {{- include "osm-seed.jobEnv" (dict "root" $ "env" .Values.fullHistory.env) | nindent 14 }}
              # Memory optimization for osmosis
              {{- if .Values.fullHistory.resources.requests }}   
              - name: MEMORY_JAVACMD_OPTIONS
                value: {{ .Values.fullHistory.resources.requests.memory | default "2Gi" | quote}}
              {{- end }}
          restartPolicy: OnFailure
          {{- include "osm-seed.nodeSelector" .Values.fullHistory | nindent 10 }}
          {{- include "osm-seed.nodeAffinity" .Values.fullHistory | nindent 10 }}
      backoffLimit: 3
{{- end }}