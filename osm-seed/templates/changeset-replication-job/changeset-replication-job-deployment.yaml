{{- if .Values.changesetReplicationJob.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-changeset-replication-job
  labels:
    app: {{ template "osm-seed.name" . }}
    component: changeset-replication-job
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-changeset-replication-job
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-changeset-replication-job
    spec:
      {{- include "osm-seed.serviceAccount" .Values.changesetReplicationJob | nindent 6 }}
      containers:
        - name: {{ .Release.Name }}-changeset-replication-job-deployment
          image: "{{ .Values.changesetReplicationJob.image.name }}:{{ .Values.changesetReplicationJob.image.tag }}"
          # command: ['/start.sh']
          {{- include "osm-seed.resources" .Values.changesetReplicationJob | nindent 10 }}
          env:
            - name: POSTGRES_HOST
              value: {{ .Release.Name }}-web-db
            - name: POSTGRES_DB
              value: {{ .Values.webDb.env.POSTGRES_DB }}
            - name: POSTGRES_PASSWORD
              value: {{ quote .Values.webDb.env.POSTGRES_PASSWORD }}
            - name: POSTGRES_USER
              value: {{ .Values.webDb.env.POSTGRES_USER }}
            - name: REPLICATION_FOLDER
              value: replication/minute
            {{- include "osm-seed.jobEnv" (dict "root" $ "env" .Values.changesetReplicationJob.env) | nindent 12 }}
              # Memory optimization for osmosis
            {{- if .Values.changesetReplicationJob.resources.requests }}
            - name: MEMORY_JAVACMD_OPTIONS
              value: {{ .Values.changesetReplicationJob.resources.requests.memory | default "2Gi" | quote}}
            {{- end }}
      {{- include "osm-seed.nodeSelector" .Values.changesetReplicationJob | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" .Values.changesetReplicationJob | nindent 6 }}
{{- end }}