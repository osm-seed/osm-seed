{{- if .Values.maprouletteApi.enabled -}}
{{- $db := .Values.maprouletteDb -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-maproulette-api
  labels:
    app: {{ template "osm-seed.name" . }}
    component: maproulette-api
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  # The backend runs an Akka cluster and caches in memory, keep one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-maproulette-api
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-maproulette-api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/maproulette-api/maproulette-api-configmap.yaml") . | sha256sum }}
    spec:
      priorityClassName: {{ .Release.Name }}-{{ .Values.maprouletteApi.priorityClass | default "medium-priority" }}
      containers:
        - name: maproulette-api
          image: "{{ .Values.maprouletteApi.image.name }}:{{ .Values.maprouletteApi.image.tag }}"
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: MR_DATABASE_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-maproulette-db:5432/{{ $db.env.POSTGRES_DB }}"
            - name: MR_DATABASE_USERNAME
              value: {{ $db.env.POSTGRES_USER | quote }}
            - name: MR_DATABASE_PASSWORD
              value: {{ $db.env.POSTGRES_PASSWORD | quote }}
            {{- range $key, $value := .Values.maprouletteApi.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /MapRouletteAPI/conf/application-overrides.conf
              subPath: application-overrides.conf
          # JVM start and DB migrations take time on the first run.
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- include "osm-seed.resources" .Values.maprouletteApi | nindent 10 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-maproulette-api-config
      {{- include "osm-seed.nodeSelector" .Values.maprouletteApi | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" .Values.maprouletteApi | nindent 6 }}
{{- end }}
