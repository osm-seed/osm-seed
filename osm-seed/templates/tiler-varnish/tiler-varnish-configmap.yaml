{{- if .Values.tilerVarnish.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-tiler-varnish-vcl
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-varnish
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
data:
  default.vcl: |
    vcl 4.1;

    backend martin {
        .host = "{{ .Release.Name }}-tiler-server-martin";
        .port = "80";
        .connect_timeout = 10s;
        .first_byte_timeout = 120s;
        .between_bytes_timeout = 30s;
    }

    acl purgers {
        "localhost";
        "127.0.0.1";
        "172.16.0.0/12";
        "10.0.0.0/8";
        "192.168.0.0/16";
    }

    sub vcl_recv {
        # BAN: invalidacion por regex (usado por tiler-cache)
        if (req.method == "BAN") {
            if (!client.ip ~ purgers) {
                return (synth(403, "Forbidden"));
            }
            if (!req.http.X-Ban-Regex) {
                return (synth(400, "Missing X-Ban-Regex header"));
            }
            ban("req.url ~ " + req.http.X-Ban-Regex);
            return (synth(200, "Banned: " + req.http.X-Ban-Regex));
        }

        # Backward-compat: tileset viejo "osm" -> "ohm" (issue #1382).
        # Rewrite antes del hash: requests /maps/osm comparten cache con /maps/ohm.
        # El boundary (/|\.json) protege /maps/osm_land (tiles static).
        if (req.url ~ "^/maps/osm(/|\.json)") {
            set req.url = regsub(req.url, "^/maps/osm", "/maps/ohm");
        }

        # fresh_tiles=1: fuerza MISS y cachea la respuesta fresh
        # (reemplaza la entrada vieja)
        if (req.url ~ "[?&]fresh_tiles=1") {
            set req.hash_always_miss = true;
            set req.url = regsub(req.url, "[?&]fresh_tiles=1", "");
        }

        if (req.method != "GET" && req.method != "HEAD") {
            return (pass);
        }

        unset req.http.Cookie;
        unset req.http.Authorization;
    }

    sub vcl_backend_response {
        # Varnish es el cache; ignoramos Cache-Control del backend
        unset beresp.http.Cache-Control;
        unset beresp.http.X-Cache-Status;
        unset beresp.http.Set-Cookie;

        # Martin echoes the request Origin and sends Vary: Origin, which stores
        # one copy per site. Tiles are public: keep a single copy for everyone.
        set beresp.http.Vary = "Accept-Encoding";

        if (bereq.url ~ "^/maps/(ne|osm_land)/") {
            # Static tiles: separate storage, near-infinite TTL
            set beresp.storage = storage.static;
            set beresp.ttl = 365d;
            set beresp.grace = 30d;
            set beresp.keep = 7d;
        } else if (bereq.url ~ "^/maps/[^/]+/[0-5]/") {
            # Dynamic low zooms (0-5): not invalidated via BAN, refreshed by short TTL
            set beresp.storage = storage.dynamic;
            set beresp.ttl = 24h;
            set beresp.grace = 1h;
            set beresp.keep = 1d;
        } else {
            # Dynamic mid/high zooms (6-20): long TTL; BAN invalidates earlier
            set beresp.storage = storage.dynamic;
            set beresp.ttl = 5d;
            set beresp.grace = 1h;
            set beresp.keep = 1d;
        }

        set beresp.uncacheable = false;

        if (beresp.status >= 500) {
            set beresp.uncacheable = true;
            set beresp.ttl = 0s;
        }
    }

    sub vcl_deliver {
        set resp.http.Cache-Control = "public, max-age=60";

        # Fixed wildcard so one cached copy is valid for every site
        set resp.http.Access-Control-Allow-Origin = "*";

        if (obj.hits > 0) {
            set resp.http.X-Cache = "HIT";
            set resp.http.X-Cache-Hits = obj.hits;
        } else {
            set resp.http.X-Cache = "MISS";
        }
    }
{{- end }}
