{{- if .Values.tilerVarnish.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tiler-varnish
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-varnish
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.tilerVarnish.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-tiler-varnish
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-tiler-varnish
    spec:
      priorityClassName: {{ .Release.Name }}-{{ .Values.tilerVarnish.priorityClass | default "medium-priority" }}
      containers:
        - name: {{ .Chart.Name }}-tiler-varnish
          image: "{{ .Values.tilerVarnish.image.name }}:{{ .Values.tilerVarnish.image.tag }}"
          command:
            - varnishd
            - "-F"
            - "-a"
            - ":6081"
            - "-f"
            - /etc/varnish/default.vcl
            - "-s"
            - "dynamic=malloc,{{ .Values.tilerVarnish.dynamicSize | default "16G" }}"
            - "-s"
            - "static=malloc,{{ .Values.tilerVarnish.staticSize | default "4G" }}"
            - "-p"
            - thread_pool_min=100
            - "-p"
            - thread_pool_max=2000
            - "-p"
            - thread_pools=2
            - "-p"
            - workspace_backend=256k
            - "-p"
            - workspace_client=256k
            - "-p"
            - http_resp_hdr_len=32k
            - "-p"
            - http_resp_size=256k
            - "-p"
            - nuke_limit=1000
            - "-p"
            - timeout_idle=30
            - "-p"
            - feature=+http2
          ports:
            - name: http
              containerPort: 6081
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: {{ .Values.tilerVarnish.readinessTimeoutSeconds | default 5 }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: {{ .Values.tilerVarnish.livenessTimeoutSeconds | default 10 }}
            failureThreshold: {{ .Values.tilerVarnish.livenessFailureThreshold | default 10 }}
          {{- include "osm-seed.resources" .Values.tilerVarnish | nindent 10 }}
          volumeMounts:
            - name: varnish-vcl
              mountPath: /etc/varnish/default.vcl
              subPath: default.vcl
              readOnly: true
            - name: varnish-workdir
              mountPath: /var/lib/varnish
      volumes:
        - name: varnish-vcl
          configMap:
            name: {{ .Release.Name }}-tiler-varnish-vcl
        - name: varnish-workdir
          emptyDir: {}
      {{- include "osm-seed.nodeSelector" .Values.tilerVarnish | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" .Values.tilerVarnish | nindent 6 }}
{{- end }}
