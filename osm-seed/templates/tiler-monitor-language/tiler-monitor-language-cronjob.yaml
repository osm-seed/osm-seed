{{- if .Values.tilerMonitorLanguage.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-tiler-monitor-language
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-monitor-language
    release: {{ .Release.Name }}
spec:
  schedule: {{ .Values.tilerMonitorLanguage.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Single run; the schedule provides periodicity (no while loop).
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.tilerMonitorLanguage.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app: {{ template "osm-seed.name" . }}
            release: {{ .Release.Name }}
            run: {{ .Release.Name }}-tiler-monitor-language
        spec:
          serviceAccountName: {{ .Release.Name }}-tiler-monitor-language
          restartPolicy: Never
          containers:
            - name: {{ .Chart.Name }}-tiler-monitor-language
              image: "{{ .Values.tilerMonitorLanguage.image.name }}:{{ .Values.tilerMonitorLanguage.image.tag }}"
              env:
                # Targets derived from the release name
                - name: K8S_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: IMPOSM_STATEFULSET
                  value: {{ .Release.Name }}-tiler-imposm
                - name: MARTIN_DEPLOYMENT
                  value: {{ .Release.Name }}-tiler-server-martin
                {{- range $key, $value := .Values.tilerMonitorLanguage.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              envFrom:
              # POSTGRES_* for the tiler DB
              - configMapRef:
                  name: {{ .Release.Name }}-tiler-db-env
                  optional: true
              {{- include "osm-seed.resources" .Values.tilerMonitorLanguage | nindent 14 }}
          {{- include "osm-seed.nodeSelector" .Values.tilerMonitorLanguage | nindent 10 }}
          {{- include "osm-seed.nodeAffinity" .Values.tilerMonitorLanguage | nindent 10 }}
{{- end }}
