{{- if .Values.osmxAdiffBuilder.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-osmx-adiff-builder
  labels:
    app: {{ template "osm-seed.name" . }}
    component: osmx-adiff-builder
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-osmx-adiff-builder
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-osmx-adiff-builder
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-osmx-adiff-builder
    spec:
      {{- include "osm-seed.serviceAccount" .Values.osmxAdiffBuilder | nindent 6 }}
      {{- with include "osm-seed.volume.owner" (dict "root" . "values" .Values.osmxAdiffBuilder "component" "osmx-adiff-builder" "volume" "osmx-db") }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: osmx-adiff-builder
          image: "{{ .Values.osmxAdiffBuilder.image.name }}:{{ .Values.osmxAdiffBuilder.image.tag }}"
          env:
            {{- range $k, $v := .Values.osmxAdiffBuilder.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.osmxAdiffBuilder.awsSecretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.osmxAdiffBuilder.awsSecretName }}
          {{- end }}
          volumeMounts:
            - name: osmx-db
              mountPath: {{ .Values.osmxAdiffBuilder.persistenceDisk.mountPath }}
          livenessProbe:
            exec:
              command: ["/app/healthcheck.sh"]
            # initialDelaySeconds must cover the initial osmx build (download planet
            # + build db from OSMX_INITIAL_SEQNUM) before create_diff_files starts;
            # too low and liveness kills the pod mid-build in a restart loop.
            {{- $probe := default dict .Values.osmxAdiffBuilder.livenessProbe }}
            initialDelaySeconds: {{ $probe.initialDelaySeconds | default 600 }}
            periodSeconds: {{ $probe.periodSeconds | default 60 }}
            timeoutSeconds: {{ $probe.timeoutSeconds | default 10 }}
            failureThreshold: {{ $probe.failureThreshold | default 3 }}
          {{- include "osm-seed.resources" .Values.osmxAdiffBuilder | nindent 10 }}
      volumes:
        - name: osmx-db
        {{- if .Values.osmxAdiffBuilder.persistenceDisk.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-osmx-adiff-builder-data
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- include "osm-seed.nodeSelector" .Values.osmxAdiffBuilder | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" .Values.osmxAdiffBuilder | nindent 6 }}
{{- end }}
