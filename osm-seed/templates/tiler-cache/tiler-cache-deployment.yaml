{{- if .Values.tilerCache.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tiler-cache
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-cache
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.tilerCache.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-tiler-cache
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-tiler-cache
    spec:
      containers:
        - name: {{ .Chart.Name }}-tiler-cache
          image: "{{ .Values.tilerCache.image.name }}:{{ .Values.tilerCache.image.tag }}"
          command:
            - sh
            - -c
            - |
              set -x
              python sqs_processor.py &
              python main.py
          ports:
            - name: http
              containerPort: {{ .Values.tilerCache.env.PORT }}
          env:
            - name: PORT
              value: {{ .Values.tilerCache.env.PORT | quote }}
            - name: ENVIRONMENT
              value: {{ .Release.Name | quote }}
            # Varnish endpoint for BAN invalidation.
            # Defaults to the in-cluster varnish service; override env.VARNISH_URL to change it.
            - name: VARNISH_URL
              value: {{ .Values.tilerCache.env.VARNISH_URL | default (printf "http://%s-tiler-varnish:6081" .Release.Name) | quote }}
            - name: ZOOM_LEVELS_TO_DELETE
              value: {{ .Values.tilerCache.env.ZOOM_LEVELS_TO_DELETE | quote }}
            # SQS processor (purge/seed) reads from a remote AWS queue
            - name: SQS_QUEUE_URL
              value: {{ .Values.tilerCache.env.SQS_QUEUE_URL | quote }}
            - name: AWS_REGION_NAME
              value: {{ .Values.tilerCache.env.AWS_REGION_NAME | default "us-east-1" | quote }}
            {{- if .Values.tilerCache.env.AWS_ACCESS_KEY_ID }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.tilerCache.env.AWS_ACCESS_KEY_ID | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.tilerCache.env.AWS_SECRET_ACCESS_KEY | quote }}
            {{- end }}
          envFrom:
          # sqs_processor connects to the tiler DB (POSTGRES_* from this configmap)
          - configMapRef:
              name: {{ .Release.Name }}-tiler-db-env
              optional: true
          # /health is valid because sqs_processor writes the heartbeat; if sqs dies,
          # /health returns 503 and the container exits, so k8s restarts it.
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.tilerCache.env.PORT }}
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.tilerCache.env.PORT }}
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- include "osm-seed.resources" .Values.tilerCache | nindent 10 }}
      {{- include "osm-seed.nodeSelector" .Values.tilerCache | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" .Values.tilerCache | nindent 6 }}
{{- end }}
