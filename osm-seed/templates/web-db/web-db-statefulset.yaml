{{- if .Values.webDb.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-web-db
  labels:
    app: {{ template "osm-seed.name" . }}
    component: web-db
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-web-db
  serviceName: {{ .Release.Name }}-web-db
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-web-db
    spec:
      priorityClassName: {{ .Release.Name }}-{{ .Values.webDb.priorityClass | default "high-priority" }}
      {{- include "osm-seed.serviceAccount" .Values.webDb | nindent 6 }}
      {{- with include "osm-seed.volume.owner" (dict "root" . "values" .Values.webDb "component" "web-db" "volume" "postgres-storage") }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-web-db
          image: "{{ .Values.webDb.image.name }}:{{ .Values.webDb.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            # - name: GET_HOSTS_FROM
            #   value: dns
            - name: POSTGRES_HOST
              value: {{ .Release.Name }}-web-db
            - name: POSTGRES_DB
              value: {{ .Values.webDb.env.POSTGRES_DB }}
            - name: POSTGRES_PASSWORD
              value: {{ quote .Values.webDb.env.POSTGRES_PASSWORD }}
            - name: POSTGRES_USER
              value: {{ default "postgres" .Values.webDb.env.POSTGRES_USER | quote }}
            - name: PGUSER
              value: {{ default "postgres" .Values.webDb.env.POSTGRES_USER | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment }}
            - name: PGDATA
              value: {{ .Values.webDb.env.PGDATA }}
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          {{- if .Values.webDb.postgresqlConfig.enabled }}
          command:
            - "sh"
            - "-c"
            - "su postgres -c 'postgres -c config_file=/etc/postgresql/postgresql.conf'"
           {{- end }}
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - exec pg_isready --host $POD_IP
            initialDelaySeconds: 120
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - exec pg_isready --host $POD_IP
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: postgres-storage
              mountPath: {{ .Values.webDb.persistenceDisk.mountPath }}
              # subPath: {{ .Values.webDb.persistenceDisk.subPath }}
            - name: shared-memory
              mountPath: /dev/shm
            {{- if .Values.webDb.postgresqlConfig.enabled }}
            - name: db-postgresql-config
              mountPath: /etc/postgresql/
            {{- end }}
            {{- if .Values.webDb.pgbackrest.enabled }}
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest
            - name: postgres-socket
              mountPath: /var/run/postgresql
            {{- end }}
          {{- include "osm-seed.resources" .Values.webDb | nindent 10 }}
        {{- if .Values.webDb.pgbackrest.enabled }}
        # pgBackRest: creates the stanza, then checks every hour and takes a base backup when the
        # last one is older than backupIntervalHours. It shares PGDATA and the unix socket with postgres.
        # It never exits, so a bad S3 config doesn't make web-db NotReady.
        - name: {{ .Chart.Name }}-web-db-pgbackrest
          image: "{{ .Values.webDb.image.name }}:{{ .Values.webDb.image.tag }}"
          command:
            - "su"
            - "postgres"
            - "-c"
            - |
              until pg_isready -q; do sleep 10; done
              until pgbackrest --stanza=main stanza-create; do
                echo "stanza-create failed, check webDb.pgbackrest S3 settings. Retrying in 5m"
                sleep 300
              done
              while true; do
                last=$(pgbackrest --stanza=main info --output=json | grep -o '"stop":[0-9][0-9]*' | tail -1 | cut -d: -f2)
                if [ -z "$last" ] || [ $(( $(date +%s) - last )) -ge {{ mul .Values.webDb.pgbackrest.backupIntervalHours 3600 }} ]; then
                  if [ "$(date +%u)" = 7 ]; then type=full; else type=diff; fi
                  pgbackrest --stanza=main backup --type=$type
                fi
                sleep 3600
              done
          volumeMounts:
            - name: postgres-storage
              mountPath: {{ .Values.webDb.persistenceDisk.mountPath }}
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest
            - name: postgres-socket
              mountPath: /var/run/postgresql
          {{- include "osm-seed.resources" .Values.webDb.pgbackrest | nindent 10 }}
        {{- end }}
      volumes:
        - name: postgres-storage
        {{- if .Values.webDb.persistenceDisk.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-web-db-data
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.webDb.sharedMemorySize }}
        {{- if .Values.webDb.postgresqlConfig.enabled }}
        - name: db-postgresql-config
          configMap:
            name: {{ .Release.Name }}-web-db-postgresql-config
        {{- end }}
        {{- if .Values.webDb.pgbackrest.enabled }}
        - name: pgbackrest-config
          secret:
            secretName: {{ .Release.Name }}-web-db-pgbackrest
        - name: postgres-socket
          emptyDir: {}
        {{- end }}
      {{- include "osm-seed.nodeSelector" .Values.webDb | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" .Values.webDb | nindent 6 }}
{{- end }}
