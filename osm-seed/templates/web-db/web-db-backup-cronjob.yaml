{{- range $i, $job := .Values.dbBackupRestore.cronjobs }}
{{- if $job.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-{{ $job.name }}-backup
  labels:
    component: {{ $job.name }}-backup
    environment: {{ $.Values.environment }}
    release: {{ $.Release.Name }}
spec:
  schedule: {{ quote $job.schedule }}
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 100
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          {{- include "osm-seed.serviceAccount" $job | nindent 10 }}
          containers:
          - name: {{ $job.name }}-backup
            image: "{{ $.Values.dbBackupRestore.image.name }}:{{ $.Values.dbBackupRestore.image.tag }}"
            command: ['/start.sh']
            env:
            # Env vars for api-web database
            {{ if eq $job.name "web-db" }}
              # DB credentials
              - name: POSTGRES_HOST
                value: {{ $.Release.Name }}-web-db
              - name: POSTGRES_DB
                value: {{ $.Values.webDb.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote $.Values.webDb.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ $.Values.webDb.env.POSTGRES_USER }}
              # DB action: backup/restore
              - name: DB_ACTION
                value: {{quote $job.env.DB_ACTION }}
              # Backup naming 
              - name: SET_DATE_AT_NAME
                value: {{quote $job.env.SET_DATE_AT_NAME }}
              - name: BACKUP_CLOUD_FOLDER
                value: {{ $job.env.BACKUP_CLOUD_FOLDER }}
              - name: BACKUP_CLOUD_FILE
                value: {{ $job.env.BACKUP_CLOUD_FILE }}
              - name: AWS_S3_BUCKET
                value: {{ $job.env.AWS_S3_BUCKET }}
              # Minute replication stream. The backup reads its state.txt to store
              # the seqno next to the dump, so planet dumps know their position.
              - name: MINUTE_REPLICATION_URL
                value: {{ $job.env.MINUTE_REPLICATION_URL }}
              # Clean up options
              - name: CLEANUP_BACKUPS
                value: {{ quote $job.env.CLEANUP_BACKUPS }}
              - name: RETENTION_DAYS
                value: {{ quote $job.env.RETENTION_DAYS }}
              # In case DB_ACTION=restore, and the backup url
              - name: RESTORE_URL_FILE
                value: {{ $job.env.RESTORE_URL_FILE}}
            {{- end }}
            # Env vars for osmcha database
            {{ if eq $job.name "tm-db" }}
              # DB credentials
              - name: POSTGRES_HOST
                value: {{ $.Release.Name }}-tm-db
              - name: POSTGRES_DB
                value: {{ $.Values.tmDb.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote $.Values.tmDb.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ $.Values.tmDb.env.POSTGRES_USER }}
              # DB action: backup/restore
              - name: DB_ACTION
                value: {{ quote $job.env.DB_ACTION }}
              # Backup naming
              - name: SET_DATE_AT_NAME
                value: {{quote $job.env.SET_DATE_AT_NAME }}
              - name: BACKUP_CLOUD_FOLDER
                value: {{ $job.env.BACKUP_CLOUD_FOLDER }}
              - name: BACKUP_CLOUD_FILE
                value: {{ $job.env.BACKUP_CLOUD_FILE }}
              - name: AWS_S3_BUCKET
                value: {{ $job.env.AWS_S3_BUCKET }}
              # Clean up options
              - name: CLEANUP_BACKUPS
                value: {{ quote $job.env.CLEANUP_BACKUPS }}
              - name: RETENTION_DAYS
                value: {{ quote $job.env.RETENTION_DAYS }}
              # In case DB_ACTION=restore, and the backup url
              - name: RESTORE_URL_FILE
                value: {{ $job.env.RESTORE_URL_FILE}}
            {{- end }}
            # Env vars for osmcha database
            {{ if eq $job.name "osmcha-db" }}
              # DB credentials
              - name: POSTGRES_HOST
                value: {{ $.Release.Name }}-osmcha-db
              - name: POSTGRES_DB
                value: {{ $.Values.osmchaDb.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote $.Values.osmchaDb.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ $.Values.osmchaDb.env.POSTGRES_USER }}
              # DB action: backup/restore
              - name: DB_ACTION
                value: {{ quote $job.env.DB_ACTION }}
              # Backup naming
              - name: SET_DATE_AT_NAME
                value: {{quote $job.env.SET_DATE_AT_NAME }}
              - name: BACKUP_CLOUD_FOLDER
                value: {{ $job.env.BACKUP_CLOUD_FOLDER }}
              - name: BACKUP_CLOUD_FILE
                value: {{ $job.env.BACKUP_CLOUD_FILE }}
              - name: AWS_S3_BUCKET
                value: {{ $job.env.AWS_S3_BUCKET }}
              # Clean up options
              - name: CLEANUP_BACKUPS
                value: {{ quote $job.env.CLEANUP_BACKUPS }}
              - name: RETENTION_DAYS
                value: {{ quote $job.env.RETENTION_DAYS }}
              # In case DB_ACTION=restore, and the backup url
              - name: RESTORE_URL_FILE
                value: {{ $job.env.RESTORE_URL_FILE}}
            {{- end }}
              # Cloud provider
              - name: CLOUDPROVIDER
                value: {{ include "osm-seed.uploadProvider" $ }}
              {{- include "osm-seed.awsCredentialsEnv" $ | nindent 14 }}
            # Node selector
            {{- include "osm-seed.resources" $job | nindent 12 }}
          restartPolicy: OnFailure
          {{- include "osm-seed.nodeSelector" $job | nindent 10 }}
          {{- include "osm-seed.nodeAffinity" $job | nindent 10 }}
---
{{- end }}
{{- end }}
