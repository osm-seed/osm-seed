{{- range $i, $job := .Values.dbBackupRestore.cronjobs }}
{{- if $job.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-{{ $job.name }}-backup
  labels:
    component: {{ $job.name }}-backup
    environment: {{ $.Values.environment }}
    release: {{ $.Release.Name }}
spec:
  schedule: {{ quote $job.schedule }}
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 100
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          {{- include "osm-seed.serviceAccount" $job | nindent 10 }}
          containers:
          - name: {{ $job.name }}-backup
            image: "{{ $.Values.dbBackupRestore.image.name }}:{{ $.Values.dbBackupRestore.image.tag }}"
            command: ['/start.sh']
            env:
            # Env vars for api-web database
            {{ if eq $job.name "web-db" }}
              # DB credentials
              - name: POSTGRES_HOST
                value: {{ $.Release.Name }}-web-db
              - name: POSTGRES_DB
                value: {{ $.Values.webDb.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote $.Values.webDb.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ $.Values.webDb.env.POSTGRES_USER }}
            {{- end }}
            # Env vars for osmcha database
            {{ if eq $job.name "tm-db" }}
              # DB credentials
              - name: POSTGRES_HOST
                value: {{ $.Release.Name }}-tm-db
              - name: POSTGRES_DB
                value: {{ $.Values.tmDb.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote $.Values.tmDb.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ $.Values.tmDb.env.POSTGRES_USER }}
            {{- end }}
            # Env vars for osmcha database
            {{ if eq $job.name "osmcha-db" }}
              # DB credentials
              - name: POSTGRES_HOST
                value: {{ $.Release.Name }}-osmcha-db
              - name: POSTGRES_DB
                value: {{ $.Values.osmchaDb.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote $.Values.osmchaDb.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ $.Values.osmchaDb.env.POSTGRES_USER }}
            {{- end }}
              # DB_ACTION, backup naming, cleanup, bucket, CLOUDPROVIDER, AWS keys: from the job env
              {{- include "osm-seed.jobEnv" (dict "root" $ "env" $job.env) | nindent 14 }}
            # Node selector
            {{- include "osm-seed.resources" $job | nindent 12 }}
          restartPolicy: OnFailure
          {{- include "osm-seed.nodeSelector" $job | nindent 10 }}
          {{- include "osm-seed.nodeAffinity" $job | nindent 10 }}
---
{{- end }}
{{- end }}
