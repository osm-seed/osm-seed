{{- if .Values.webApi.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-api
  labels:
    app: {{ template "osm-seed.name" . }}
    component: web-api
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.webApi.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-web-api
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-web-api
    spec:
      {{- include "osm-seed.serviceAccount" .Values.webApi | nindent 6 }}
      priorityClassName: {{ .Release.Name }}-{{ .Values.webApi.priorityClass | default "high-priority" }}
      containers:
        - name: {{ .Chart.Name }}-web-api
          image: "{{ .Values.webApi.image.name }}:{{ .Values.webApi.image.tag }}"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # /api/versions goes through Apache, Passenger and Rails without touching the database.
          startupProbe:
            httpGet:
              path: /api/versions
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120 # up to 10 min, because the compile process takes time.
          readinessProbe:
            httpGet:
              path: /api/versions
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/versions
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- include "osm-seed.resources" .Values.webApi | nindent 10 }}
          env:
            # ---- Computed / cluster-specific (not plain web.env pass-throughs) ----
            - name: GET_HOSTS_FROM
              value: dns
            - name: POSTGRES_HOST
              value: {{ .Release.Name }}-web-db
            - name: POSTGRES_DB
              value: {{ .Values.webDb.env.POSTGRES_DB }}
            - name: POSTGRES_PASSWORD
              value: {{ quote .Values.webDb.env.POSTGRES_PASSWORD }}
            - name: POSTGRES_USER
              value: {{ .Values.webDb.env.POSTGRES_USER }}
            - name: OPENSTREETMAP_memcache_servers
              value: {{ .Release.Name }}-memcached:11211
            # cgimap always runs as its own pod (external)
            - name: EXTERNAL_CGIMAP
              value: "true"
            - name: CGIMAP_URL
              value: {{ .Release.Name }}-cgimap
            - name: CGIMAP_PORT
              value: {{ quote 80 }}
            # ---- Everything else passes straight through from web.env ----
            {{- range $k, $v := .Values.webApi.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - mountPath: /dev/shm
              name: shared-memory
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.webApi.sharedMemorySize }}
          name: shared-memory
      {{- include "osm-seed.nodeSelector" .Values.webApi | nindent 6 }}
      {{- include "osm-seed.affinity" (dict "root" . "values" .Values.webApi "component" "web-api") | nindent 6 }}
{{- end }}
