# ====================================================================================================
# Variables for osm-seed database backup and restore
# ====================================================================================================
dbBackupRestore:
  image:
    name: ""
    tag: ""
  cronjobs:
    - name: web-db
      serviceAccount:
        enabled: false
        name: ""
      enabled: false
      schedule: "* * * * *"
      env:
        # DB action: backup/restore
        DB_ACTION: backup
        # Naming backup files
        SET_DATE_AT_NAME: true
        BACKUP_CLOUD_FOLDER: database/web-db
        BACKUP_CLOUD_FILE: osmseed-api-web-db
        AWS_S3_BUCKET: secure-bucket
        # Replication stream read at backup time to store the seqno next to the dump.
        # Generic OSM default; deployments override it with their own stream.
        MINUTE_REPLICATION_URL: https://planet.osmseed.org/replication/minute
        # Clean up backups options
        CLEANUP_BACKUPS: true
        RETENTION_DAYS: "30"
      resources: {}
      nodeSelector: {}
      nodeAffinity:
        enabled: false
        key: "nodegroup_type"
        values: ["web"]
    - name: osmcha-db
      enabled: false
      serviceAccount:
        enabled: false
        name: ""
      schedule: "* * * * *"
      env:
        # DB action: backup/restore
        DB_ACTION: backup
        # Naming backup files
        SET_DATE_AT_NAME: true
        BACKUP_CLOUD_FOLDER: database/osmcha-db
        BACKUP_CLOUD_FILE: osmseed-osmcha-db
        AWS_S3_BUCKET: secure-bucket
        # Clean up backups options
        CLEANUP_BACKUPS: true
        RETENTION_DAYS: "30"
      resources: {}
      nodeSelector: {}
      nodeAffinity:
        enabled: false
        key: "nodegroup_type"
        values: ["web"]
    - name: tm-db
      enabled: false
      serviceAccount:
        enabled: false
        name: ""
      schedule: "0 3 * * *"
      env:
        DB_ACTION: backup
        SET_DATE_AT_NAME: true
        BACKUP_CLOUD_FOLDER: database/tm-db
        BACKUP_CLOUD_FILE: osmseed-tm-db
        AWS_S3_BUCKET: secure-bucket
        CLEANUP_BACKUPS: true
        RETENTION_DAYS: "30"
      resources: {}
      nodeSelector: {}
      nodeAffinity:
        enabled: false
        key: "nodegroup_type"
        values: ["web"]
