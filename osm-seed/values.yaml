# ====================================================================================================
# Variables for nominatim api
# ====================================================================================================
nominatimApi:
  enabled: false
  image:
    name: ""
    tag: ""
  priorityClass: "medium-priority"
  serviceAnnotations: {}
  replicaCount: 1
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - nominatim-api.osmseed.org
    tls:
      enabled: false
      secretName: ""
  env:
    PBF_URL: http://download.geofabrik.de/europe/monaco-latest.osm.pbf
    REPLICATION_URL: http://download.geofabrik.de/europe/monaco-updates
    REPLICATION_UPDATE_INTERVAL: 86400
    REPLICATION_RECHECK_INTERVAL: 900
    FREEZE: false
    IMPORT_WIKIPEDIA: false
    IMPORT_US_POSTCODES: false
    IMPORT_GB_POSTCODES: false
    IMPORT_TIGER_ADDRESSES: false
    THREADS: 4
    NOMINATIM_PASSWORD: psw1234
    PGDATA: /var/lib/postgresql/14/main
    NOMINATIM_ADDRESS_LEVEL_CONFIG_URL: 
      https://gist.githubusercontent.com/lonvia/8502c61b3dd159e67eb8be8368d864c1/raw/d05a1d681230632bb2e35cbf363f2baec8acd657/address-levels.json
    UPDATE_MODE: continuous #Options: `continuous`/`once`/`catch-up`/`none` (default: `none`)
    OSMSEED_WEB_API_DOMAIN: www.osmseed.org
    # Public host the UI calls for the Nominatim API. Should match ingress.hosts[0].
    NOMINATIM_API_ENDPOINT: nominatim-api.osmseed.org
  # First import can take many hours: startupProbe keeps liveness off until /status answers.
  # failureThreshold * periodSeconds = max import time allowed (1440 * 60s = 24h).
  startupProbe:
    enabled: true
    path: /status
    port: 8080
    periodSeconds: 60
    timeoutSeconds: 30
    failureThreshold: 1440
  livenessProbe:
    enabled: true
    path: /status
    port: 8080
    periodSeconds: 60
    timeoutSeconds: 30
    failureThreshold: 6
  resources: {}
  persistenceDisk:
    enabled: true
    accessMode: ReadWriteOnce
    mountPath: /var/lib/postgresql/14/main
    subPath: nominatim-pgdata
    # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
    staticHostPath: false
    localVolumeHostPath: /mnt/nominatim-db-data
    localVolumeSize: 10Gi
    # AWS
    AWS_ElasticBlockStore_volumeID: ""
    AWS_ElasticBlockStore_size: 100Gi
  nodeSelector: {}
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]

# ====================================================================================================
# Variables for overpass-api
# ====================================================================================================
overpassApi:
  enabled: false
  image:
    name: ""
    tag: ""
  priorityClass: "medium-priority"
  serviceAnnotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - overpass-api.osmseed.org
    tls:
      enabled: false
      secretName: ""
  env:
    OVERPASS_META: "yes"
    OVERPASS_MODE: init
    OVERPASS_PLANET_URL: http://download.geofabrik.de/europe/monaco-latest.osm.bz2
    OVERPASS_DIFF_URL: http://download.openstreetmap.fr/replication/europe/monaco/minute/
    OVERPASS_RULES_LOAD: 10
    OVERPASS_PLANET_PREPROCESS: 'mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium
      cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf'
    OVERPASS_REPLICATION_SEQUENCE_NUMBER: 5201000
    OVERPASS_ALLOW_DUPLICATE_QUERIES: "yes"
  persistenceDisk:
    enabled: false
    accessMode: ReadWriteOnce
    mountPath: /db
    # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
    staticHostPath: false
    localVolumeHostPath: /mnt/overpass-api-db-data
    localVolumeSize: 10Gi
    # AWS
    AWS_ElasticBlockStore_volumeID: ""
    AWS_ElasticBlockStore_size: 50Gi
  resources: {}
  nodeSelector: {}
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]
