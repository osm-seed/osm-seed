environment: development

# Where the disks live: aws (EBS volumes) or k3s (folders on the node).
# The old name cloudProvider still works, and wins when set.
storageProvider: aws
# Jobs take CLOUDPROVIDER, AWS_S3_BUCKET and AWS keys from their own env.

# Service type: NodePort, ClusterIP or LoadBalancer. ClusterIP is recommended;
serviceType: ClusterIP

# Create a cert-manager ClusterIssuer (Let's Encrypt). Opt-in.
createClusterIssuer: false

# Default ingress class for all components. Override per component with
# <component>.ingress.className. Leave empty if you expose services another way.
ingressClassName: ""

# Email for Let's Encrypt expiry notices.
adminEmail: admin@osmseed.org

# ====================================================================================================
# web-db: PostgreSQL for the OSM website / API (apidb)
# ====================================================================================================

webDb:
  enabled: false
  image:
    name: ""
    tag: ""
  priorityClass: "high-priority"
  env:
    POSTGRES_DB: openstreetmap
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: "1234"
    POSTGRES_PORT: 5432
    PGDATA: /var/lib/postgresql/data
    ENVIRONMENT: "production"
  persistenceDisk:
    enabled: false
    mountPath: /var/lib/postgresql/data
    subPath: postgresql-db
    # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
    # Only one release can use the folder. To free it, on the node: rm <localVolumeHostPath>/.owner
    staticHostPath: false
    localVolumeHostPath: /mnt/db-data
    localVolumeSize: 10Gi
    # AWS
    AWS_ElasticBlockStore_volumeID: ""
    AWS_ElasticBlockStore_size: 50Gi
  resources: {}
  nodeSelector: {}
  sharedMemorySize: 64Mi
  # To use postgresqlConfig, you need to have already $PGDATA set up
  postgresqlConfig:
    enabled: false
    values: |
      listen_addresses = '*'
      max_connections = 100
      shared_buffers = 128MB
      effective_cache_size = 256MB
      maintenance_work_mem = 64MB
      checkpoint_completion_target = 0.7
      wal_buffers = 16MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      work_mem = 4MB
      min_wal_size = 80MB
      max_wal_size = 1GB
      max_worker_processes = 4
      max_parallel_workers_per_gather = 2
      max_parallel_workers = 4
      # Needed by replication-job (osmdbt logical replication)
      shared_preload_libraries = 'osm-logical'
      wal_level = logical
      max_replication_slots = 1
      # PostgreSQL 17.11+ only allows whitelisted output plugins
      output_plugin_libraries = 'pgoutput, test_decoding, osm-logical'
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["database"]
  # Service account for the pod, e.g. to use IRSA on EKS for pgbackrest S3 access
  serviceAccount:
    enabled: false
    name: ""
  # WAL archiving and daily base backups to S3 with pgBackRest, same setup as OSMF.
  # Requires postgresqlConfig.enabled. Enabling it restarts the database.
  pgbackrest:
    enabled: false
    s3Bucket: ""
    s3Region: us-east-1
    s3Endpoint: s3.amazonaws.com
    # Folder inside the bucket
    s3Path: /web-db
    # "shared" = static keys below, "auto" = node IAM role (EC2/EKS),
    # "web-id" = IRSA on EKS (set serviceAccount). Leave the keys empty for auto and web-id
    s3KeyType: shared
    s3Key: ""
    s3KeySecret: ""
    # Encrypt the repo with aes-256-cbc. Keep this value safe, backups can't be read without it
    cipherPass: ""
    # Number of full backups to keep (weekly fulls, so 2 = 1-2 weeks of history)
    retentionFull: 2
    # Seconds before postgres closes a WAL segment that is not full and sends it to S3.
    # It is the max data loss when the disk is lost
    archiveTimeout: 60
    # Hours between base backups. Full on Sundays, diff the other days
    backupIntervalHours: 24
    # Max WAL queued for archive-push (e.g. 10GiB). Above it pgbackrest drops WAL so pg_wal
    # doesn't fill the disk, and the archive gets a gap. Empty = no limit
    archivePushQueueMax: ""
    resources: {}
# ====================================================================================================
# web-api: OSM website + API (openstreetmap-website, Rails)
# ====================================================================================================
webApi:
  enabled: false
  image:
    name: "ghcr.io/osm-seed/web"
    tag: "2.0.0"
  serviceAccount:
    enabled: false
    name: ""
  priorityClass: "high-priority"
  replicaCount: 1
  serviceAnnotations: {}
  # Per-component Ingress. enabled toggles creation; className falls back to the
  # global ingressClassName; annotations are passed verbatim (provider-specific
  # lives here); hosts default to web/api/apex of domain; tls is opt-in.
  ingress:
    enabled: false
    className: ""
    hosts:
      - www.osmseed.org
      - dev.osmseed.org
      - api.osmseed.org
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  env:
    SERVER_URL: "www.osmseed.org"
    SERVER_PROTOCOL: "https"
    MAILER_ADDRESS: smtp.gmail.com
    MAILER_DOMAIN: gmail.com
    MAILER_USERNAME: example@gmail.com
    MAILER_PASSWORD: "1234"
    MAILER_FROM: no-reply@example.com
    MAILER_PORT: 25
    NOMINATIM_URL: "nominatim"
    OVERPASS_URL: "overpassApi"
    OAUTH_CLIENT_ID: "abcd" # Create client ID and key as OAuth2 Application
    OAUTH_KEY: "xyz"
    ORGANIZATION_NAME: "OSMSeed"
    WEBSITE_STATUS: "online"
    API_TIMEOUT: 30
    WEB_TIMEOUT: 30
    RAILS_MASTER_KEY: none
    RAILS_CREDENTIALS_YML_ENC: none
    RAILS_LOG_LEVEL: info
    RAILS_STORAGE_SERVICE: local
    RAILS_STORAGE_REGION: us-east-1
    RAILS_STORAGE_BUCKET: osmseed-website-bucket
    PASSENGER_MAX_POOL_SIZE: 6
    OPENSTREETMAP_AUTH_ID: ""
    OPENSTREETMAP_AUTH_SECRET: ""
  resources: {}
  nodeSelector: {}
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    cpuUtilization:
      enabled: false
      value: 85
    memoryUtilization:
      enabled: false
      value: 85
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policyValue: 100
        periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 60
        policyValue: 50
        periodSeconds: 60
  sharedMemorySize: 256Mi
  livenessProbeExec: true

  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]
  podAntiAffinity: # To set that no two pods are scheduled on the same node
    enabled: false
