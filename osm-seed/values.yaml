    initialDelaySeconds: 600
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 3
  # WORKDIR inside the container is /data
  env:
    PLANET_PBF_URL: 
      https://planet.osmseed.org/planet/planet-latest.osm.pbf
    REPLICATION_URL: https://planet.osmseed.org/replication/minute
    API_URL: https://www.osmseed.org
    OSMX_INITIAL_SEQNUM: "0"
    AWS_S3_BUCKET: s3://planet.osmseed.org
  persistenceDisk:
    enabled: true
    mountPath: /data
    size: 50Gi
    storageClassName: ""
    # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
    staticHostPath: true
    localVolumeHostPath: /mnt/osmx-adiff-data
    localVolumeSize: 50Gi
  resources: {}
  nodeSelector: {}
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]

