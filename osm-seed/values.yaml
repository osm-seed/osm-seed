# ====================================================================================================
# Variables for osmx-adiff-builder (builds augmented diffs from OSMX into S3)
# ====================================================================================================
osmxAdiffBuilder:
  enabled: false
  # Image is not built by this repo's chartpress; set it from the umbrella chart.
  image:
    name: ""
    tag: ""
  # ServiceAccount with S3 access (IRSA).
  serviceAccount:
    enabled: false
    name: ""
  # Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, loaded via envFrom. Empty = skip.
  awsSecretName: ""
  # initialDelaySeconds must cover the initial osmx build (planet download + db build)
