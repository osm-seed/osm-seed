# ====================================================================================================
# Variables for tiler-imposm
# ====================================================================================================
tilerImposm:
  enabled: false
  image:
    name: ""
    tag: ""
  serviceAccount:
    enabled: false
    name: ""
  priorityClass: "medium-priority"
  livenessProbe:
    enabled: true
    initialDelaySeconds: 14400
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  env:
    TILER_IMPORT_FROM: osm
    TILER_IMPORT_PBF_URL: http://download.geofabrik.de/europe/monaco-latest.osm.pbf
    REPLICATION_URL: http://download.geofabrik.de/europe/monaco-updates/
    SEQUENCE_NUMBER: "0"
    OVERWRITE_STATE: false
    UPLOAD_EXPIRED_FILES: true
    IMPORT_NATURAL_EARTH: true
    IMPORT_OSM_LAND: true
    IMPOSM3_IMPORT_LAYERS: all
    # Refresh/recreate materialized views during replication updates
    REFRESH_MVIEWS: false
    RECREATE_MVIEWS_ON_UPDATE: false
    # Upload of expired-tiles files needs CLOUDPROVIDER set (aws|gcp) + bucket/creds.
    # If CLOUDPROVIDER is unset the upload is skipped.
    CLOUDPROVIDER: aws
    AWS_S3_BUCKET: ""
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
  persistenceDisk:
    enabled: false
    accessMode: ReadWriteOnce
    mountPath: /mnt/data
    # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
    staticHostPath: false
    localVolumeHostPath: /mnt/tiler-imposm-data
    localVolumeSize: 10Gi
    # AWS
    AWS_ElasticBlockStore_volumeID: ""
    AWS_ElasticBlockStore_size: 50Gi
  resources: {}
  nodeSelector: {}
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]
# ====================================================================================================
# Variables for tiler-server
# ====================================================================================================
tilerServer:
  enabled: false
  image:
    name: ""
    tag: ""
  priorityClass: "medium-priority"
  serviceAccount:
    enabled: false
    name: ""
  replicaCount: 1
  serviceAnnotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - tiler.osmseed.org
    tls:
      enabled: false
      secretName: ""
  env:
    AWS_S3_BUCKET: ""
    TILER_SERVER_PORT: 9090
    # s3 renders a Deployment (stateless); file renders a StatefulSet with persistenceDisk
    TILER_CACHE_TYPE: s3
    TILER_CACHE_BASEPATH: /mnt/data
    TILER_CACHE_MAX_ZOOM: 22
    # in case s3
    TILER_CACHE_BUCKET: osmseed-tiler
    TILER_CACHE_REGION: us-east-1
    TILER_CACHE_AWS_ACCESS_KEY_ID: xyz
    TILER_CACHE_AWS_SECRET_ACCESS_KEY: xyz/q
    # Optional custom S3 endpoint (MinIO, etc.). Empty = AWS default.
    TILER_CACHE_AWS_ENDPOINT: ""
    EXECUTE_REINDEX: false
    EXECUTE_VACUUM_ANALYZE: false
  command: "./start.sh" # ./start.sh & ./tile_cache_downloader.sh & ./expire-watcher.sh
  # HPA. Only applies when TILER_CACHE_TYPE=s3 (Deployment).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    cpuUtilization: 60
  # In case you use TILER_CACHE_TYPE: file with  persistenceDisk
  persistenceDisk:
    enabled: false
    accessMode: ReadWriteOnce
    mountPath: /mnt/data
    # k3s (local-path dynamic / static hostPath)
    localVolumeHostPath: /mnt/tiler-server-data
    localVolumeSize: 10Gi
    # AWS
    AWS_ElasticBlockStore_volumeID: ""
    AWS_ElasticBlockStore_size: 50Gi
  resources: {}
  nodeSelector: {}
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]

