# ====================================================================================================
# Tiler cache: runs sqs_processor.py (purge/seed from AWS SQS) + main.py (/clean-cache API), like the compose tiler_sqs_cleaner
# ====================================================================================================
tilerCache:
  enabled: false
  # Default image for standalone/direct installs; chartpress overrides name/tag
  # in the umbrella chart (valuesPath osm-seed.tilerCache.image).
  image:
    name: ""
    tag: ""
  replicaCount: 1
  env:
    PORT: 8000
    ENVIRONMENT: development
    # Varnish endpoint to send BAN requests. Empty => http://<release>-tiler-varnish:6081
    VARNISH_URL: ""
    ZOOM_LEVELS_TO_DELETE: 13,14,15,16,17,18,19,20
    # Base URL to download the imposm expire files. Empty => path-style S3 URL
    EXPIRED_TILES_BASE_URL: ""
    # SQS processor (purge/seed): remote AWS queue + credentials
    SQS_QUEUE_URL: ""
    AWS_REGION_NAME: us-east-1
    # AWS creds for boto3. On EKS use a serviceAccount/IRSA instead and leave these empty.
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
  resources: {}
  nodeSelector: {}
# ====================================================================================================
# Tiler monitor (pipeline): FastAPI that checks changesets reach the tiler DB / tiles / S3.
# Runs only pipeline-monitor (main.py); the language monitor is a separate workload.
# ====================================================================================================
tilerMonitorPipeline:
  enabled: false
  # Default image for standalone/direct installs; chartpress overrides name/tag
  # in the umbrella chart (valuesPath osm-seed.tilerMonitorPipeline.image).
  image:
    name: ""
    tag: ""
  replicaCount: 1
  env:
    MONITOR_PORT: 8001
    OHM_API_BASE: https://www.osmseed.org/api/0.6
