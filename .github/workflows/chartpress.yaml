name: Chartpress Publish
on:
  push:
    branches: [main, 'build-*']
    tags: ['*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE.txt']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE.txt']
jobs:
  build:
    # Name a branch build-<something> to publish a dev chart from it.
    # Its pull request is skipped, so the branch does not build twice.
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'build-')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GHCR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup git
      run: |
        git config --global user.email "noreply@osm-seed.org"
        git config --global user.name "Github Action"

    - name: Install dependencies
      run: pip install chartpress==2.3.0

    - name: Run Chartpress
      env:
        GITHUB_TOKEN: ${{ secrets.GHCR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        # Pull requests only build to validate. Pushes to main, build-* and tags
        # publish the chart and push the images. Chartpress uses the git history
        # (fetch-depth: 0) to find which images changed.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          chartpress --builder docker-buildx
        else
          chartpress --push --publish-chart --builder docker-buildx
        fi

